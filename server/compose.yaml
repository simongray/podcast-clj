# The podcast server, with tailscale serve or a server for HTTPS in front of
# it. Give the settings below in a file .env next to this one, and start it
# from this folder with:
#
#     docker compose up -d --build
services:
  podcast-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # this machine alone reaches it, and what is in front brings the rest
    ports:
      - "127.0.0.1:8400:8400"
    environment:
      PODCAST_SERVER_NAMES: ${PODCAST_SERVER_NAMES:?the name of the server, e.g. pi.example.ts.net}
      PODCAST_SERVER_PASSWORD: ${PODCAST_SERVER_PASSWORD:-}
      # true when only the tailnet reaches it, so that it needs no password
      PODCAST_SERVER_PRIVATE_NETWORK: ${PODCAST_SERVER_PRIVATE_NETWORK:-false}
      PODCAST_SERVER_CLIENT: /client
      # the credentials with which the proxy signs requests, if any
      PODCAST_SERVER_PODCASTINDEX_KEY: ${PODCAST_SERVER_PODCASTINDEX_KEY:-}
      PODCAST_SERVER_PODCASTINDEX_SECRET: ${PODCAST_SERVER_PODCASTINDEX_SECRET:-}
      PODCAST_SERVER_OP3_TOKEN: ${PODCAST_SERVER_OP3_TOKEN:-}
      JDK_JAVA_OPTIONS: -Xmx256m
    volumes:
      - data:/data
      - ${PODCAST_CLIENT_DIR:?the folder of the built files of the client}:/client:ro

volumes:
  data:
