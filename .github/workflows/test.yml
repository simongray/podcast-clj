name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Java 25, Clojure 1.12, Node 24
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: JVM tests
        run: clojure -X:test

      # The build runs the tests itself, but exits 0 when one fails, so
      # node runs the built file, and its exit code fails the step.
      - name: Node tests
        run: |
          npm ci
          clojure -M:cljs compile test --config-merge '{:autorun false}'
          node target/node-tests.js

      - name: Node tests, compiled with advanced optimizations
        run: |
          clojure -M:cljs release test --config-merge '{:autorun false}'
          node target/node-tests.js

      # The runner of the build prints the report on the console, which the
      # script reads from a headless Chrome, the one that the runner has.
      - name: Browser tests, in a headless Chrome
        run: |
          clojure -M:cljs compile browser-test
          node test/browser-run.mjs target/browser-test

      - name: Lint
        run: clojure -Sdeps '{:deps {clj-kondo/clj-kondo {:mvn/version "2026.08.04"}}}' -M -m clj-kondo.main --lint src test dev web server build.clj

      - name: Server jar
        run: clojure -T:build server

  electron:
    name: Electron, in a virtual display
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('deps.edn', 'dev/devices/electron/deps.edn', 'dev/devices/electron/package.json') }}

      # Ubuntu 24.04 keeps unprivileged user namespaces from processes
      # without an AppArmor profile, and Chromium's sandbox needs them
      - name: Let Electron's sandbox run
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: The Electron test
        run: xvfb-run --auto-servernum dev/devices/run.sh electron

      - name: The local server's log
        if: failure()
        run: cat dev/devices/electron/server.log

  floor:
    name: Java 11, Clojure 1.11, the floor the library declares
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: clojure-floor-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: Library tests on the floor
        run: clojure -X:test-floor
